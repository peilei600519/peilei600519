<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGPT Sidebar with Codex</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #212121;
        color: #ececec;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-columns: 280px 1fr;
        background: #212121;
      }

      .sidebar {
        background: #171717;
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .sidebar__title {
        padding: 10px 12px;
        font-size: 14px;
        color: #b4b4b4;
      }

      .sidebar__link {
        border: 0;
        width: 100%;
        border-radius: 10px;
        padding: 12px;
        background: transparent;
        color: #ececec;
        display: flex;
        align-items: center;
        gap: 12px;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .sidebar__link:hover,
      .sidebar__link:focus-visible {
        background: #2f2f2f;
        outline: none;
      }

      .sidebar__link--codex {
        background: #2a2a2a;
        font-weight: 600;
      }

      .sidebar__icon {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
        background: #10a37f;
        color: #ffffff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .main {
        display: grid;
        place-items: center;
        padding: 32px;
      }

      .main__panel {
        max-width: 640px;
        text-align: center;
      }

      .main__panel h1 {
        margin: 0 0 12px;
        font-size: clamp(32px, 5vw, 56px);
      }

      .main__panel p {
        margin: 0;
        color: #b4b4b4;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar" aria-label="ChatGPT 左边栏">
      <div class="sidebar__title">ChatGPT</div>
      <button class="sidebar__link" type="button">
        <span class="sidebar__icon" aria-hidden="true">GPT</span>
        <span>ChatGPT</span>
      </button>
      <button class="sidebar__link sidebar__link--codex" type="button" aria-current="page">
        <span class="sidebar__icon" aria-hidden="true">CX</span>
        <span>CODEX</span>
      </button>
    </aside>
    <main class="main">
      <section class="main__panel" aria-labelledby="page-title">
        <h1 id="page-title">CODEX</h1>
        <p>已在 ChatGPT 左边栏添加 CODEX 入口，可作为代码任务的快捷入口。</p>
      </section>
    </main>
  </body>
</html>
